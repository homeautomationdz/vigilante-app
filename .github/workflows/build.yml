name: Build Vigilante APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vigilante-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to dist branch
        if: success()
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" /tmp/Vigilante-1.0-debug.apk
          git config user.name "vigilante-ci"
          git config user.email "ci@vigilante.local"
          git checkout --orphan dist
          git rm -rf --cached . > /dev/null 2>&1 || true
          rm -rf ./* || true
          cp /tmp/Vigilante-1.0-debug.apk ./Vigilante-1.0-debug.apk
          echo "Built from $GITHUB_SHA at $(date -u)" > BUILD_INFO.txt
          git add Vigilante-1.0-debug.apk BUILD_INFO.txt
          git commit -m "CI build $GITHUB_SHA"
          git push -f origin dist
