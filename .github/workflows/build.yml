name: Build Vigilante APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests (export/crypto pipeline) + release APKs
        run: gradle :app:testFullDebugUnitTest assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}

      - name: Stage outputs outside the repo tree
        if: always()
        run: |
          mkdir -p /tmp/keep
          cp /tmp/build.log /tmp/keep/build.log || echo "no log" > /tmp/keep/build.log
          [ -f app/build/outputs/apk/full/release/app-full-release.apk ] && \
            cp app/build/outputs/apk/full/release/app-full-release.apk /tmp/keep/Vigilante-2.4-full.apk
          [ -f app/build/outputs/apk/stats/release/app-stats-release.apk ] && \
            cp app/build/outputs/apk/stats/release/app-stats-release.apk /tmp/keep/Vigilante-2.4-stats.apk
          true

      - name: Publish build log
        if: always()
        run: |
          set -e
          git config user.name "vigilante-ci"
          git config user.email "ci@vigilante.local"
          git checkout --orphan buildlog-tmp
          git rm -rf --cached . > /dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp /tmp/keep/build.log ./build.log
          echo "run=$GITHUB_RUN_NUMBER sha=$GITHUB_SHA status=${{ job.status }} at=$(date -u)" > RUN_INFO.txt
          git add build.log RUN_INFO.txt
          git commit -m "build log run $GITHUB_RUN_NUMBER"
          git push -f origin buildlog-tmp:buildlog

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vigilante-apks
          path: /tmp/keep/Vigilante-2.4-*.apk

      - name: Publish APKs to dist branch
        if: success()
        run: |
          set -e
          git config user.name "vigilante-ci"
          git config user.email "ci@vigilante.local"
          git checkout --orphan dist-tmp
          git rm -rf --cached . > /dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp /tmp/keep/Vigilante-2.4-full.apk ./Vigilante-2.4-full.apk
          cp /tmp/keep/Vigilante-2.4-stats.apk ./Vigilante-2.4-stats.apk
          echo "Built from $GITHUB_SHA at $(date -u)" > BUILD_INFO.txt
          git add Vigilante-2.4-full.apk Vigilante-2.4-stats.apk BUILD_INFO.txt
          git commit -m "CI build $GITHUB_SHA"
          git push -f origin dist-tmp:dist
